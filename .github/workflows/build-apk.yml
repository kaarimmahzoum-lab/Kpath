name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install --fetch-retries=5

      - name: Clean native Android folder
        run: rm -rf android

      - name: Prebuild Expo Android Project
        run: npx expo prebuild --platform android --clean

      - name: Inject Missing Android Resources & Colors
        run: |
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/values-night
          cat << 'EOF' > android/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splashscreen_background">#0B0F19</color>
              <color name="iconBackground">#0B0F19</color>
              <color name="colorPrimary">#00A8FF</color>
          </resources>
          EOF
          cp android/app/src/main/res/values/colors.xml android/app/src/main/res/values-night/colors.xml

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
